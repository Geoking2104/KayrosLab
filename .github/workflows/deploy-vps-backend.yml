name: Deploy KayrosLab backend - OVH VPS

# Modele repris du pipeline openDPE, eprouve sur ce meme VPS (51.210.9.71) :
# le depot est clone dans /opt/kayroslab, le workflow fait un git pull puis
# execute le script de deploiement. Pas de scp : la source de verite est git.
#
# Prerequis (une seule fois, cf. deploy/ovh-vps/BOOTSTRAP.md) :
#   git clone https://github.com/Geoking2104/KayrosLab.git /opt/kayroslab
#   cp /opt/kayroslab/backend/fastify/.env.sample /opt/kayroslab/backend/fastify/.env
#
# Secrets requis : VPS_SSH_USER, VPS_SSH_KEY (identiques a ceux d'openDPE)
# et une cle LLM pour activer le fournisseur en production :
#   NVIDIA_API_KEY  (prioritaire : NVIDIA NIM, API OpenAI-compatible) ;
#   MISTRAL_API_KEY (repli automatique si NVIDIA echoue, ou primaire sans NVIDIA).
# Variables de depot optionnelles (Settings > Variables, non secretes) :
#   LLM_PROVIDER (auto|nvidia|mistral|anthropic|ollama|mock), NVIDIA_MODEL,
#   LLM_MAX_CONCURRENCY. Vides = defauts (auto, modele par defaut, 2).
#   NVIDIA_TIMEOUT_MS, NVIDIA_MAX_TOKENS, KAYROS_CONSOLE_RUN_TIMEOUT_MS :
#   ecrits dans le .env seulement s'ils sont definis (sinon defauts du code :
#   180000 ms, 4096 jetons, 30 min).
#   Kimi K3 : NVIDIA_MODEL=moonshotai/kimi-k3 et LLM_PROVIDER supprimee (ou
#   vide/auto) ; cf. backend/fastify/DEPLOY-VPS.md §4.
# Secret optionnel METRICS_TOKEN : jeton Bearer exige par /metrics (ecrit
#   dans le .env seulement s'il est defini ; sinon /metrics reste reserve au
#   loopback direct, ce qui suffit au Prometheus local de monitoring/).
# Supervision (monitoring/README.md) : si Alertmanager tourne sur le VPS, un
#   silence de 15 min encadre deploy-backend.sh ; absent ou injoignable, le
#   script est sans effet et ne fait jamais echouer le deploiement.
# Connecteurs chat (optionnels ; un secret absent ne modifie PAS la valeur du
#   .env serveur, il n'est jamais efface — cf. docs/CHAT-CONNECTORS-SETUP.md) :
#   secrets SLACK_SIGNING_SECRET, SLACK_CLIENT_ID, SLACK_CLIENT_SECRET,
#     SLACK_BOT_TOKEN, SLACK_WEBHOOK_URL ;
#   secrets TEAMS_APP_ID, TEAMS_BOT_PASSWORD, TEAMS_WEBHOOK_URL ;
#   secrets DISCORD_APPLICATION_ID, DISCORD_PUBLIC_KEY, DISCORD_BOT_TOKEN,
#     DISCORD_CLIENT_ID, DISCORD_CLIENT_SECRET, DISCORD_WEBHOOK_URL ;
#   variables SLACK_OAUTH_SCOPES, SLACK_GATE_CHANNEL, TEAMS_OAUTH_TENANT,
#     TEAMS_GATE_CHANNEL, DISCORD_INVITE_PERMISSIONS, DISCORD_OAUTH_SCOPES,
#     DISCORD_GATE_CHANNEL.
# Secrets WhatsApp (optionnels tant que P1 n'est pas branche) :
#   WA_TOKEN, WA_PHONE_NUMBER_ID, WA_VERIFY_TOKEN, WA_DISPLAY_NUMBER,
#   WA_TEMPLATE_INVITE, WA_HASH_SALT

on:
  push:
    branches: [main]
    paths:
      - 'backend/fastify/**'
      - 'backend/timesfm-service/**'
      - 'core/**'
      - 'deploy/ovh-vps/**'
      - 'deploy/timesfm.compose.yaml'
      - '.github/workflows/deploy-vps-backend.yml'
      - 'index.html'
      - 'index.fr.html'
      - 'tokens.css'
      - 'site.css'
      - 'marketing.css'
      - 'studio.css'
      - 'legal/**'
      - 'backend/web/public/console/**'
      - 'backend/web/public/assets/**'
      - 'kayroslab-complete-with-ai-agents.html'
      - 'whitepaper-*.html'
  workflow_dispatch:

jobs:
  deploy-vps:
    runs-on: ubuntu-latest
    steps:
      - name: SSH into VPS and deploy
        uses: appleboy/ssh-action@v1.2.0
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          NVIDIA_MODEL: ${{ vars.NVIDIA_MODEL }}
          LLM_PROVIDER: ${{ vars.LLM_PROVIDER }}
          LLM_MAX_CONCURRENCY: ${{ vars.LLM_MAX_CONCURRENCY }}
          NVIDIA_TIMEOUT_MS: ${{ vars.NVIDIA_TIMEOUT_MS }}
          NVIDIA_MAX_TOKENS: ${{ vars.NVIDIA_MAX_TOKENS }}
          NVIDIA_FAST_MODEL: ${{ vars.NVIDIA_FAST_MODEL }}
          KAYROS_CONSOLE_RUN_TIMEOUT_MS: ${{ vars.KAYROS_CONSOLE_RUN_TIMEOUT_MS }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          MISTRAL_MODEL: ${{ secrets.MISTRAL_MODEL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: ${{ secrets.ANTHROPIC_MODEL }}
          # Override optionnel vers une base distante. Absent — le cas normal —
          # le VPS provisionne son propre Postgres local et genere lui-meme le
          # mot de passe. Ce secret n'existe que si l'on veut deleguer la base
          # a un hebergeur, et il prime alors sur le provisionnement local.
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          POSITIONNER_GITHUB_TOKEN: ${{ secrets.POSITIONNER_GITHUB_TOKEN }}
          POSITIONNER_GITLAB_TOKEN: ${{ secrets.POSITIONNER_GITLAB_TOKEN }}
          POSITIONNER_GOOGLE_API_KEY: ${{ secrets.POSITIONNER_GOOGLE_API_KEY }}
          POSITIONNER_GOOGLE_CX: ${{ secrets.POSITIONNER_GOOGLE_CX }}
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          CRYSTALKNOWS_API_TOKEN: ${{ secrets.CRYSTALKNOWS_API_TOKEN }}
          KAYROS_CONNECTOR_ENCRYPTION_KEY: ${{ secrets.KAYROS_CONNECTOR_ENCRYPTION_KEY }}
          KAYROS_SMTP_URL: ${{ secrets.KAYROS_SMTP_URL }}
          KAYROS_SMTP_PASS: ${{ secrets.KAYROS_SMTP_PASS }}
          KAYROS_SMTP_USER: ${{ secrets.KAYROS_SMTP_USER }}
          KAYROS_SMTP_HOST: ${{ secrets.KAYROS_SMTP_HOST }}
          KAYROS_MAIL_FROM: ${{ secrets.KAYROS_MAIL_FROM }}
          KAYROS_CONTACT_TO: ${{ secrets.KAYROS_CONTACT_TO }}
          KAYROS_MCP_CLIENTS_JSON: ${{ secrets.KAYROS_MCP_CLIENTS_JSON }}
          KAYROS_S3_BUCKET: ${{ secrets.KAYROS_S3_BUCKET }}
          KAYROS_S3_REGION: ${{ secrets.KAYROS_S3_REGION }}
          KAYROS_S3_ENDPOINT: ${{ secrets.KAYROS_S3_ENDPOINT }}
          KAYROS_S3_ACCESS_KEY_ID: ${{ secrets.KAYROS_S3_ACCESS_KEY_ID }}
          KAYROS_S3_SECRET_ACCESS_KEY: ${{ secrets.KAYROS_S3_SECRET_ACCESS_KEY }}
          KAYROS_TIMESFM_ENABLED: ${{ vars.KAYROS_TIMESFM_ENABLED }}
          KAYROS_TIMESFM_TOKEN: ${{ secrets.KAYROS_TIMESFM_TOKEN }}
          OIDC_ISSUER: ${{ secrets.OIDC_ISSUER }}
          OIDC_CLIENT_ID: ${{ secrets.OIDC_CLIENT_ID }}
          OIDC_CLIENT_SECRET: ${{ secrets.OIDC_CLIENT_SECRET }}
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          X_CLIENT_ID: ${{ secrets.X_CLIENT_ID }}
          X_CLIENT_SECRET: ${{ secrets.X_CLIENT_SECRET }}
          WA_TOKEN: ${{ secrets.WA_TOKEN }}
          WA_PHONE_NUMBER_ID: ${{ secrets.WA_PHONE_NUMBER_ID }}
          WA_VERIFY_TOKEN: ${{ secrets.WA_VERIFY_TOKEN }}
          WA_DISPLAY_NUMBER: ${{ secrets.WA_DISPLAY_NUMBER }}
          WA_TEMPLATE_INVITE: ${{ secrets.WA_TEMPLATE_INVITE }}
          WA_HASH_SALT: ${{ secrets.WA_HASH_SALT }}
          METRICS_TOKEN: ${{ secrets.METRICS_TOKEN }}
          # Connecteurs chat (optionnels) : absents = valeur du .env serveur conservée.
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_SIGNING_SECRET: ${{ secrets.SLACK_SIGNING_SECRET }}
          SLACK_CLIENT_ID: ${{ secrets.SLACK_CLIENT_ID }}
          SLACK_CLIENT_SECRET: ${{ secrets.SLACK_CLIENT_SECRET }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          TEAMS_APP_ID: ${{ secrets.TEAMS_APP_ID }}
          TEAMS_BOT_PASSWORD: ${{ secrets.TEAMS_BOT_PASSWORD }}
          TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
          DISCORD_APPLICATION_ID: ${{ secrets.DISCORD_APPLICATION_ID }}
          DISCORD_PUBLIC_KEY: ${{ secrets.DISCORD_PUBLIC_KEY }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_CLIENT_ID: ${{ secrets.DISCORD_CLIENT_ID }}
          DISCORD_CLIENT_SECRET: ${{ secrets.DISCORD_CLIENT_SECRET }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          SLACK_OAUTH_SCOPES: ${{ vars.SLACK_OAUTH_SCOPES }}
          SLACK_GATE_CHANNEL: ${{ vars.SLACK_GATE_CHANNEL }}
          TEAMS_OAUTH_TENANT: ${{ vars.TEAMS_OAUTH_TENANT }}
          TEAMS_GATE_CHANNEL: ${{ vars.TEAMS_GATE_CHANNEL }}
          DISCORD_INVITE_PERMISSIONS: ${{ vars.DISCORD_INVITE_PERMISSIONS }}
          DISCORD_OAUTH_SCOPES: ${{ vars.DISCORD_OAUTH_SCOPES }}
          DISCORD_GATE_CHANNEL: ${{ vars.DISCORD_GATE_CHANNEL }}
        with:
          host: 51.210.9.71
          username: ${{ secrets.VPS_SSH_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          command_timeout: 30m
          envs: NVIDIA_API_KEY,NVIDIA_MODEL,NVIDIA_FAST_MODEL,LLM_PROVIDER,LLM_MAX_CONCURRENCY,NVIDIA_TIMEOUT_MS,NVIDIA_MAX_TOKENS,KAYROS_CONSOLE_RUN_TIMEOUT_MS,MISTRAL_API_KEY,MISTRAL_MODEL,ANTHROPIC_API_KEY,ANTHROPIC_MODEL,DATABASE_URL,POSITIONNER_GITHUB_TOKEN,POSITIONNER_GITLAB_TOKEN,POSITIONNER_GOOGLE_API_KEY,POSITIONNER_GOOGLE_CX,GOOGLE_OAUTH_CLIENT_ID,GOOGLE_OAUTH_CLIENT_SECRET,LINKEDIN_ACCESS_TOKEN,CRYSTALKNOWS_API_TOKEN,KAYROS_CONNECTOR_ENCRYPTION_KEY,KAYROS_SMTP_URL,KAYROS_SMTP_PASS,KAYROS_SMTP_USER,KAYROS_SMTP_HOST,KAYROS_MAIL_FROM,KAYROS_CONTACT_TO,KAYROS_MCP_CLIENTS_JSON,KAYROS_S3_BUCKET,KAYROS_S3_REGION,KAYROS_S3_ENDPOINT,KAYROS_S3_ACCESS_KEY_ID,KAYROS_S3_SECRET_ACCESS_KEY,KAYROS_TIMESFM_ENABLED,KAYROS_TIMESFM_TOKEN,OIDC_ISSUER,OIDC_CLIENT_ID,OIDC_CLIENT_SECRET,X_CLIENT_ID,X_CLIENT_SECRET,WA_TOKEN,WA_PHONE_NUMBER_ID,WA_VERIFY_TOKEN,WA_DISPLAY_NUMBER,WA_TEMPLATE_INVITE,WA_HASH_SALT,METRICS_TOKEN,SLACK_BOT_TOKEN,SLACK_SIGNING_SECRET,SLACK_CLIENT_ID,SLACK_CLIENT_SECRET,SLACK_WEBHOOK_URL,TEAMS_APP_ID,TEAMS_BOT_PASSWORD,TEAMS_WEBHOOK_URL,DISCORD_APPLICATION_ID,DISCORD_PUBLIC_KEY,DISCORD_BOT_TOKEN,DISCORD_CLIENT_ID,DISCORD_CLIENT_SECRET,DISCORD_WEBHOOK_URL,SLACK_OAUTH_SCOPES,SLACK_GATE_CHANNEL,TEAMS_OAUTH_TENANT,TEAMS_GATE_CHANNEL,DISCORD_INVITE_PERMISSIONS,DISCORD_OAUTH_SCOPES,DISCORD_GATE_CHANNEL
          script: |
            set -e
            git config --global --add safe.directory /opt/kayroslab
            cd /opt/kayroslab
            git fetch origin main
            git reset --hard origin/main
            git status --porcelain
            if [ -z "${NVIDIA_API_KEY:-}" ] && [ -z "${MISTRAL_API_KEY:-}" ]; then
              echo "AVERTISSEMENT : NVIDIA_API_KEY et MISTRAL_API_KEY sont vides — le salon tourne sur le moteur deterministe (provider 'mock'). Definir le secret NVIDIA_API_KEY pour activer la LLM." >&2
            elif [ -z "${NVIDIA_API_KEY:-}" ]; then
              echo "INFO : NVIDIA_API_KEY absente — fournisseur LLM : Mistral." >&2
            fi
            node <<'NODE'
            const fs = require('fs');
            const envPath = '/opt/kayroslab/backend/fastify/.env';
            let contents = fs.readFileSync(envPath, 'utf8');
            // Le secret GitHub est la source de verite : une valeur vide ici
            // vide aussi la ligne du .env (desactivation du provider).
            const replacements = {
              NVIDIA_API_KEY: process.env.NVIDIA_API_KEY,
              NVIDIA_MODEL: process.env.NVIDIA_MODEL,
              LLM_PROVIDER: process.env.LLM_PROVIDER,
              LLM_MAX_CONCURRENCY: process.env.LLM_MAX_CONCURRENCY,
              MISTRAL_API_KEY: process.env.MISTRAL_API_KEY,
              MISTRAL_MODEL: process.env.MISTRAL_MODEL,
              ANTHROPIC_API_KEY: process.env.ANTHROPIC_API_KEY,
              ANTHROPIC_MODEL: process.env.ANTHROPIC_MODEL,
              KAYROS_RUNS_FILE: '/opt/kayroslab/data/runs.json',
              KAYROS_CONSOLE_URL: 'https://www.kayroslab.com/console/',
              KAYROS_PASSWORD_RESET_TTL_SEC: '1800',
              KAYROS_MAIL_FROM: process.env.KAYROS_MAIL_FROM || 'KayrosLab <geoffroydelatournelle@gmail.com>',
              KAYROS_CONTACT_TO: process.env.KAYROS_CONTACT_TO || 'contact@kayroslab.com',
              KAYROS_SMTP_HOST: process.env.KAYROS_SMTP_HOST || 'smtp.gmail.com',
              KAYROS_SMTP_PORT: '465',
              KAYROS_SMTP_SECURE: '1',
              KAYROS_SMTP_USER: process.env.KAYROS_SMTP_USER || 'geoffroydelatournelle@gmail.com',
              KAYROS_WA_EVENTS_FILE: '/opt/kayroslab/data/wa-events.ndjson',
              OLLAMA_ENDPOINT: 'http://127.0.0.1:11434',
              EMBED_MODEL: 'bge-m3',
            };
            const optionalSources = {
              NVIDIA_TIMEOUT_MS: process.env.NVIDIA_TIMEOUT_MS,
              NVIDIA_MAX_TOKENS: process.env.NVIDIA_MAX_TOKENS,
              // Profil `fast` (intégrations) : vide = défaut du code (lib/llm-config.mjs).
              NVIDIA_FAST_MODEL: process.env.NVIDIA_FAST_MODEL,
              KAYROS_CONSOLE_RUN_TIMEOUT_MS: process.env.KAYROS_CONSOLE_RUN_TIMEOUT_MS,
              DATABASE_URL: process.env.DATABASE_URL,
              GITHUB_TOKEN: process.env.POSITIONNER_GITHUB_TOKEN,
              GITLAB_TOKEN: process.env.POSITIONNER_GITLAB_TOKEN,
              GOOGLE_API_KEY: process.env.POSITIONNER_GOOGLE_API_KEY,
              GOOGLE_CX: process.env.POSITIONNER_GOOGLE_CX,
              LINKEDIN_ACCESS_TOKEN: process.env.LINKEDIN_ACCESS_TOKEN,
              CRYSTALKNOWS_API_TOKEN: process.env.CRYSTALKNOWS_API_TOKEN,
              KAYROS_CONNECTOR_ENCRYPTION_KEY: process.env.KAYROS_CONNECTOR_ENCRYPTION_KEY,
              KAYROS_SMTP_URL: process.env.KAYROS_SMTP_URL,
              KAYROS_SMTP_PASS: process.env.KAYROS_SMTP_PASS,
              KAYROS_MAIL_FROM: process.env.KAYROS_MAIL_FROM,
              KAYROS_CONTACT_TO: process.env.KAYROS_CONTACT_TO,
              KAYROS_MCP_CLIENTS_JSON: process.env.KAYROS_MCP_CLIENTS_JSON,
              KAYROS_S3_BUCKET: process.env.KAYROS_S3_BUCKET,
              KAYROS_S3_REGION: process.env.KAYROS_S3_REGION,
              KAYROS_S3_ENDPOINT: process.env.KAYROS_S3_ENDPOINT,
              KAYROS_S3_ACCESS_KEY_ID: process.env.KAYROS_S3_ACCESS_KEY_ID,
              KAYROS_S3_SECRET_ACCESS_KEY: process.env.KAYROS_S3_SECRET_ACCESS_KEY,
              KAYROS_TIMESFM_ENABLED: process.env.KAYROS_TIMESFM_ENABLED,
              KAYROS_TIMESFM_TOKEN: process.env.KAYROS_TIMESFM_TOKEN,
              OIDC_ISSUER: process.env.OIDC_ISSUER,
              OIDC_CLIENT_ID: process.env.OIDC_CLIENT_ID,
              OIDC_CLIENT_SECRET: process.env.OIDC_CLIENT_SECRET,
              GOOGLE_OAUTH_CLIENT_ID: process.env.GOOGLE_OAUTH_CLIENT_ID,
              GOOGLE_OAUTH_CLIENT_SECRET: process.env.GOOGLE_OAUTH_CLIENT_SECRET,
              X_CLIENT_ID: process.env.X_CLIENT_ID,
              X_CLIENT_SECRET: process.env.X_CLIENT_SECRET,
              WA_TOKEN: process.env.WA_TOKEN,
              WA_PHONE_NUMBER_ID: process.env.WA_PHONE_NUMBER_ID,
              WA_VERIFY_TOKEN: process.env.WA_VERIFY_TOKEN,
              WA_DISPLAY_NUMBER: process.env.WA_DISPLAY_NUMBER,
              WA_TEMPLATE_INVITE: process.env.WA_TEMPLATE_INVITE,
              WA_HASH_SALT: process.env.WA_HASH_SALT,
              METRICS_TOKEN: process.env.METRICS_TOKEN,
              // Connecteurs Slack / Teams / Discord : écrits seulement s'ils sont définis,
              // jamais effacés (connexion « un bouton » active dès que les secrets existent).
              SLACK_BOT_TOKEN: process.env.SLACK_BOT_TOKEN,
              SLACK_SIGNING_SECRET: process.env.SLACK_SIGNING_SECRET,
              SLACK_CLIENT_ID: process.env.SLACK_CLIENT_ID,
              SLACK_CLIENT_SECRET: process.env.SLACK_CLIENT_SECRET,
              SLACK_WEBHOOK_URL: process.env.SLACK_WEBHOOK_URL,
              TEAMS_APP_ID: process.env.TEAMS_APP_ID,
              TEAMS_BOT_PASSWORD: process.env.TEAMS_BOT_PASSWORD,
              TEAMS_WEBHOOK_URL: process.env.TEAMS_WEBHOOK_URL,
              DISCORD_APPLICATION_ID: process.env.DISCORD_APPLICATION_ID,
              DISCORD_PUBLIC_KEY: process.env.DISCORD_PUBLIC_KEY,
              DISCORD_BOT_TOKEN: process.env.DISCORD_BOT_TOKEN,
              DISCORD_CLIENT_ID: process.env.DISCORD_CLIENT_ID,
              DISCORD_CLIENT_SECRET: process.env.DISCORD_CLIENT_SECRET,
              DISCORD_WEBHOOK_URL: process.env.DISCORD_WEBHOOK_URL,
              SLACK_OAUTH_SCOPES: process.env.SLACK_OAUTH_SCOPES,
              SLACK_GATE_CHANNEL: process.env.SLACK_GATE_CHANNEL,
              TEAMS_OAUTH_TENANT: process.env.TEAMS_OAUTH_TENANT,
              TEAMS_GATE_CHANNEL: process.env.TEAMS_GATE_CHANNEL,
              DISCORD_INVITE_PERMISSIONS: process.env.DISCORD_INVITE_PERMISSIONS,
              DISCORD_OAUTH_SCOPES: process.env.DISCORD_OAUTH_SCOPES,
              DISCORD_GATE_CHANNEL: process.env.DISCORD_GATE_CHANNEL,
            };
            for (const [name, value] of Object.entries(optionalSources)) {
              if (value) replacements[name] = value;
            }
            for (const [name, value] of Object.entries(replacements)) {
              const safe = value === undefined || value === null ? '' : value;
              const line = `${name}=${safe}`;
              const pattern = new RegExp(`^${name}=.*$`, 'm');
              contents = pattern.test(contents)
                ? contents.replace(pattern, line)
                : `${contents.trimEnd()}\n${line}\n`;
            }
            fs.writeFileSync(envPath, contents, { mode: 0o600 });
            NODE
            find deploy/ovh-vps -name "*.sh" -exec sed -i 's/\r$//' {} \;
            OLLAMA_ENDPOINT=http://127.0.0.1:11434 EMBED_MODEL=bge-m3 bash deploy/ovh-vps/install-ollama.sh
            # Silence Alertmanager autour du redemarrage pm2 (soft-fail :
            # sans Alertmanager, rien ne change). Le trap l'expire meme si le
            # deploiement echoue, pour que les alertes reprennent aussitot.
            SILENCE_SH=monitoring/alertmanager-silence.sh
            if [ -f "$SILENCE_SH" ]; then
              DURATION_MINUTES=15 SILENCE_COMMENT="Deploiement GitHub Actions $(git rev-parse --short HEAD 2>/dev/null)" \
                bash "$SILENCE_SH" start || true
              trap 'bash "$SILENCE_SH" stop || true' EXIT
            fi
            KAYROS_LOCAL_PG=1 bash deploy/ovh-vps/deploy-backend.sh
            echo "Deployed at $(date)"
