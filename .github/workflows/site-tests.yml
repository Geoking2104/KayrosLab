name: Site tests

on:
  pull_request:
    paths: ['index.html', 'index.fr.html', '*.html', 'marketing.css', 'assets/**', 'tests/**', 'deploy/ovh-vps/assemble-www.sh', '.github/workflows/site-tests.yml', '.github/workflows/deploy-positionning-pages.yml']
  push:
    branches: [main]
    paths: ['index.html', 'index.fr.html', '*.html', 'marketing.css', 'assets/**', 'tests/**', 'deploy/ovh-vps/assemble-www.sh', '.github/workflows/site-tests.yml']

jobs:
  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Landing, pages secondaires et assemblage
        run: node --test tests/site-home.test.mjs tests/integrations-site.test.mjs tests/sales-oracle-site.test.mjs tests/console-pages-deploy.test.mjs tests/legal-site.test.mjs
