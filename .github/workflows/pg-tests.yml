name: Postgres integration

# Les tests unitaires de PgRunStore observent le SQL emis avec un pool simule :
# ils ne prouvent ni que le schema s'applique, ni que jsonb se comporte comme
# attendu. Ce workflow fournit un vrai Postgres pour que core/pg-integration
# s'execute reellement au lieu d'etre ignore.

on:
  push:
    branches:
      - main
      - 'codex/**'
    paths:
      - 'core/pg-store.mjs'
      - 'core/pg-integration.test.mjs'
      - 'core/pg-collaboration-store.test.mjs'
      - 'core/pg-run-store.test.mjs'
      - 'core/sql/schema.sql'
      - 'core/sql/migrations/**'
      - 'core/connector-config.mjs'
      - 'backend/fastify/lib/context.mjs'
      - '.github/workflows/pg-tests.yml'
  pull_request:
    branches: [main]
    paths:
      - 'core/pg-store.mjs'
      - 'core/pg-integration.test.mjs'
      - 'core/sql/schema.sql'
      - 'core/sql/migrations/**'
      - 'core/connector-config.mjs'
      - '.github/workflows/pg-tests.yml'

jobs:
  integration:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: kayros
          POSTGRES_PASSWORD: kayros
          POSTGRES_DB: kayroslab_test
        ports:
          - 5432:5432
        # Sans ce healthcheck le job demarre avant que la base accepte les
        # connexions, et l'echec ressemble a un bug du store.
        options: >-
          --health-cmd "pg_isready -U kayros"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # core/ n'a aucune dependance npm, mais core/pg-store.mjs fait
      # `await import('pg')`. NODE_PATH ne sert a rien ici : la resolution ESM
      # l'ignore, contrairement au require CommonJS. Le paquet doit donc etre
      # installe a la racine, d'ou core/ remonte naturellement.
      - name: Install pg client at repository root
        run: npm install pg@^8 --no-save --no-package-lock --ignore-scripts

      - name: Run the Postgres integration suite
        env:
          DATABASE_URL: postgres://kayros:kayros@localhost:5432/kayroslab_test
        run: |
          # La sortie est capturee sans `set -e` puis affichee AVANT tout
          # verdict : un garde-fou qui avorte a l'affectation masque l'erreur
          # qu'il existe pour reveler.
          set +e
          output=$(node --test --test-reporter=tap core/pg-integration.test.mjs 2>&1)
          code=$?
          set -e
          echo "$output"

          # Un test ignore passe au vert : sans ce garde-fou, une variable mal
          # nommee rendrait ce workflow inutile sans jamais le signaler.
          if echo "$output" | grep -Eq "# skipped [1-9][0-9]*"; then
            echo "ERREUR : toute la suite d'integration a ete ignoree." >&2
            exit 1
          fi
          if [ "$code" -ne 0 ]; then
            echo "ERREUR : la suite d'integration a echoue (code $code)." >&2
            exit 1
          fi

      - name: Unit suite against the simulated pool
        run: node --test core/pg-run-store.test.mjs
