name: Console app tests
on:
  pull_request:
    paths: ['frontend/console-app/**', '.github/workflows/console-app-tests.yml']
  push:
    branches: [main]
    paths: ['frontend/console-app/**']
jobs:
  test:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend/console-app } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: frontend/console-app/package-lock.json }
      - run: npm ci
      - run: npm test
      - run: npm run build
