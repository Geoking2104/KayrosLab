name: Backend tests

on:
  push:
    branches: [main]
    paths:
      - 'backend/fastify/tests/**'
      - 'backend/fastify/lib/**'
      - 'backend/fastify/routes/**'
      - 'backend/fastify/plugins/**'
      - 'backend/adapters/timesfm/**'
      - 'backend/timesfm-service/**'
      - 'backend/fastify/package.json'
      - 'backend/fastify/package-lock.json'
      - 'core/connectors.mjs'
      - 'core/connectors-teams-deep.mjs'
      - 'core/connectors-discord-deep.mjs'
      - 'core/connectors-slack-deep.mjs'
      - 'core/connector-config.mjs'
      - 'core/connector-config.test.mjs'
      - 'core/swarm.mjs'
      - 'core/hybrid-agent-gateway.mjs'
      - 'core/collaboration-store.mjs'
      - 'core/governance.mjs'
      - 'core/auth.mjs'
      - 'core/adapters/timesfm-forecast.mjs'
      - '.github/workflows/backend-tests.yml'
  pull_request:
    branches: [main]
    paths:
      - 'backend/fastify/tests/**'
      - 'backend/fastify/lib/**'
      - 'backend/fastify/routes/**'
      - 'backend/fastify/plugins/**'
      - 'backend/adapters/timesfm/**'
      - 'backend/timesfm-service/**'
      - 'backend/fastify/package.json'
      - 'backend/fastify/package-lock.json'
      - 'core/adapters/timesfm-forecast.mjs'
      - 'core/connector-config.mjs'
      - 'core/connector-config.test.mjs'
      - 'core/swarm.mjs'
      - 'core/hybrid-agent-gateway.mjs'
      - 'core/collaboration-store.mjs'
      - '.github/workflows/backend-tests.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install backend dependencies
        working-directory: backend/fastify
        run: npm ci --ignore-scripts
      - name: Run backend test suite
        working-directory: backend/fastify
        run: npm test
      - name: Run console core security and decision-thread tests
        run: node --test core/connector-config.test.mjs tests/hybrid-agent-gateway.test.mjs tests/console-pages-deploy.test.mjs
      - name: Compile-check isolated TimesFM service
        run: python -m py_compile backend/timesfm-service/timesfm_service.py
