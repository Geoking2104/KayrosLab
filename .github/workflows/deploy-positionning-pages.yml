name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'frontend/positionning-app/**'
      - 'index.html'
      - 'index.fr.html'
      - 'backend/web/views/index.ejs'
      - 'backend/web/locales/**'
      - 'backend/web/public/assets/**'
      - 'kayroslab-complete-with-ai-agents.html'
      - 'tests/demo-html.test.mjs'
      - 'tests/sales-oracle-site.test.mjs'
      - 'cycle-timeline.html'
      - 'portfolio-dormant.html'
      - 'portfolio-board.html'
      - 'ontology-explorer.html'
      - 'ontology-panel.html'
      - 'tokens.css'
      - 'livret-blanc-*.html'
      - 'whitepaper-*.html'
      - 'CNAME'
      - '.github/workflows/deploy-positionning-pages.yml'
  workflow_dispatch:

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/positionning-app/package-lock.json

      - name: Validate public demo JavaScript and CTA wiring
        run: node --test tests/demo-html.test.mjs tests/sales-oracle-site.test.mjs

      - name: Install & build positionning-app
        working-directory: frontend/positionning-app
        run: |
          npm ci
          npm run build

      - name: Assemble deploy folder
        run: |
          set -e
          mkdir -p deploy/positionner-app
          mkdir -p deploy/assets

          # Core static pages (must exist)
          for f in index.html index.fr.html tokens.css CNAME; do
            if [ ! -f "$f" ]; then
              echo "ERROR: required file missing: $f" >&2
              exit 1
            fi
            cp "$f" deploy/
          done

          # Website editorial assets
          if [ -d backend/web/public/assets ]; then
            cp -r backend/web/public/assets/. deploy/assets/
          else
            echo "ERROR: backend/web/public/assets is missing" >&2
            exit 1
          fi

          # Main demo — size guard against accidental truncation
          DEMO="kayroslab-complete-with-ai-agents.html"
          if [ ! -f "$DEMO" ]; then
            echo "ERROR: $DEMO is missing" >&2
            exit 1
          fi
          SIZE=$(wc -c < "$DEMO")
          echo "Demo size: ${SIZE} bytes"
          if [ "$SIZE" -lt 50000 ]; then
            echo "ERROR: $DEMO is only ${SIZE} bytes (expected > 50 KB). Possible truncation." >&2
            exit 1
          fi
          cp "$DEMO" deploy/

          # Optional HTML pages
          for f in \
            arbitrage.html \
            cycle-timeline.html \
            portfolio-dormant.html \
            portfolio-board.html \
            ontology-explorer.html \
            ontology-panel.html \
            livret-blanc-kayroslab.html \
            livret-blanc-positionner.html \
            livret-blanc-ecouter.html \
            livret-blanc-hackathon.html \
            whitepaper-kayroslab.html \
            whitepaper-position.html \
            whitepaper-listen.html \
            whitepaper-hackathon.html
          do
            if [ -f "$f" ]; then
              cp "$f" deploy/
              echo "copied $f"
            else
              echo "skip (missing) $f"
            fi
          done

          # Built React app
          if [ -d frontend/positionning-app/dist ]; then
            cp -r frontend/positionning-app/dist/* deploy/positionner-app/
          else
            echo "ERROR: positionning-app dist/ missing after build" >&2
            exit 1
          fi

          touch deploy/.nojekyll
          echo "Deploy folder contents:"
          find deploy -type f | sort

      - name: Publish to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: deploy
          force_orphan: true
