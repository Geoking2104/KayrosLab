name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'frontend/positionning-app/**'
      - 'index.html'
      - 'index.fr.html'
      - 'kayroslab-complete-with-ai-agents.html'
      - 'cycle-timeline.html'
      - 'portfolio-dormant.html'
      - 'tokens.css'
      - 'livret-blanc-*.html'
      - 'whitepaper-*.html'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci
        working-directory: frontend/positionning-app
      - run: npm run build
        working-directory: frontend/positionning-app

      - run: |
          mkdir -p deploy/positionner-app
          cp index.html index.fr.html kayroslab-complete-with-ai-agents.html tokens.css livret-blanc-kayroslab.html livret-blanc-positionner.html livret-blanc-ecouter.html whitepaper-*.html deploy/
          # N — cycle SSE timeline + M dormant portfolio
          cp cycle-timeline.html portfolio-dormant.html deploy/ 2>/dev/null || true
          cp -r frontend/positionning-app/dist/* deploy/positionner-app/
          touch deploy/.nojekyll
          cp CNAME deploy/

      - uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: deploy
          force_orphan: true
