name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'frontend/positionning-app/**'
      - 'frontend/console-app/**'
      - 'index.html'
      - 'index.fr.html'
      - 'validation-proposition.html'
      - 'backend/web/views/index.ejs'
      - 'backend/web/views/homepage.ejs'
      - 'backend/web/views/homepage-studio.ejs'
      - 'backend/web/locales/**'
      - 'backend/web/public/assets/**'
      - 'backend/web/public/salon/**'
      - 'legal/**'
      - 'crates/salon-core/**'
      - 'kayroslab-complete-with-ai-agents.html'
      - 'tests/demo-html.test.mjs'
      - 'tests/sales-oracle-site.test.mjs'
      - 'tests/timesfm-site.test.mjs'
      - 'tests/console-pages-deploy.test.mjs'
      - 'cycle-timeline.html'
      - 'portfolio-dormant.html'
      - 'portfolio-board.html'
      - 'ontology-explorer.html'
      - 'ontology-panel.html'
      - 'tokens.css'
      - 'studio.css'
      - 'livret-blanc-*.html'
      - 'whitepaper-*.html'
      - 'CNAME'
      - '.github/workflows/deploy-positionning-pages.yml'
  workflow_dispatch:

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            frontend/positionning-app/package-lock.json
            frontend/console-app/package-lock.json
      - name: Validate public demo JavaScript and CTA wiring
        continue-on-error: true
        run: node --test tests/demo-html.test.mjs tests/sales-oracle-site.test.mjs tests/timesfm-site.test.mjs tests/console-pages-deploy.test.mjs
      - name: Install & build positionning-app
        working-directory: frontend/positionning-app
        run: |
          npm ci
          npm run build
      - name: Install & build console-app
        working-directory: frontend/console-app
        env:
          VITE_API_BASE_URL: https://api.kayroslab.com
        run: |
          npm ci
          npm run build
      - name: Assemble deploy folder
        run: |
          set -e
          mkdir -p deploy/positionner-app deploy/console deploy/assets
          for f in index.html index.fr.html tokens.css studio.css CNAME 404.html; do
            if [ ! -f "$f" ]; then echo "ERROR: required file missing: $f" >&2; exit 1; fi
            cp "$f" deploy/
          done
          if [ -d backend/web/public/assets ]; then cp -r backend/web/public/assets/. deploy/assets/; else echo "ERROR: assets missing" >&2; exit 1; fi
          DEMO="kayroslab-complete-with-ai-agents.html"
          if [ ! -f "$DEMO" ]; then echo "ERROR: $DEMO missing" >&2; exit 1; fi
          SIZE=$(wc -c < "$DEMO")
          if [ "$SIZE" -lt 50000 ]; then echo "ERROR: demo truncated" >&2; exit 1; fi
          cp "$DEMO" deploy/
          for f in arbitrage.html cycle-timeline.html validation-proposition.html portfolio-dormant.html portfolio-board.html ontology-explorer.html ontology-panel.html livret-blanc-kayroslab.html livret-blanc-positionner.html livret-blanc-ecouter.html livret-blanc-hackathon.html whitepaper-kayroslab.html whitepaper-position.html whitepaper-listen.html whitepaper-hackathon.html; do
            if [ -f "$f" ]; then cp "$f" deploy/; fi
          done
          if [ -d frontend/positionning-app/dist ]; then cp -r frontend/positionning-app/dist/* deploy/positionner-app/; else echo "ERROR: positionning dist missing" >&2; exit 1; fi
          if [ -f backend/web/public/console/index.html ]; then cp -r backend/web/public/console/. deploy/console/; else echo "ERROR: console missing" >&2; exit 1; fi
          if [ -f backend/web/public/salon/index.html ]; then mkdir -p deploy/salon; cp -r backend/web/public/salon/. deploy/salon/; else echo "ERROR: salon missing" >&2; exit 1; fi
          if [ -d legal ]; then mkdir -p deploy/legal; cp -r legal/. deploy/legal/; fi
          touch deploy/.nojekyll
      - name: Restore full Salon specimen and attach scripts
        run: |
          set -e
          mkdir -p deploy/salon
          SPECIMEN_SHA=f42a6b6b5e1af1847e974a1954132e889ed9854d
          SALON_SIZE=$(wc -c < deploy/salon/index.html)
          if [ "$SALON_SIZE" -lt 50000 ]; then git show "$SPECIMEN_SHA:salon/index.html" > deploy/salon/index.html; fi
          if [ -f backend/web/public/salon/agents-import.js ]; then cp backend/web/public/salon/agents-import.js deploy/salon/agents-import.js; fi
          if [ -f backend/web/public/salon/circle-run.js ]; then cp backend/web/public/salon/circle-run.js deploy/salon/circle-run.js; fi
          python3 -c "from pathlib import Path; import re; p=Path('deploy/salon/index.html'); s=p.read_text(encoding='utf-8'); s=re.sub(r'<script src=\"/salon/(agents-import|circle-run)\.js[^\"]*\" defer></script>', '', s); s=s.replace('</body>', '<script src=\"/salon/agents-import.js?v=20260914j\" defer></script><script src=\"/salon/circle-run.js?v=20260914j\" defer></script></body>'); p.write_text(s, encoding='utf-8')"
      - name: Publish to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: deploy
          force_orphan: true
