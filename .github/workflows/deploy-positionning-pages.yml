name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'frontend/positionning-app/**'
      - 'index.html'
      - 'kayroslab-reference.html'
      - 'kayroslab-portfolio.html'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci
        working-directory: frontend/positionning-app
      - run: npm run build
        working-directory: frontend/positionning-app

      - run: |
          mkdir -p deploy/positionner-app
          cp index.html kayroslab-reference.html kayroslab-portfolio.html deploy/
          cp -r frontend/positionning-app/dist/* deploy/positionner-app/
          touch deploy/.nojekyll

      - uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: deploy
          force_orphan: true
