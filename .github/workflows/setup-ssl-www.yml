name: Setup SSL (Let's Encrypt) - www.kayroslab.com

# www.kayroslab.com -> 51.210.9.71. L'apex kayroslab.com reste GitHub Pages.

on:
  workflow_dispatch:

jobs:
  setup-ssl-www:
    runs-on: ubuntu-latest
    steps:
      - name: Configure HTTPS for www.kayroslab.com
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: 51.210.9.71
          username: ${{ secrets.VPS_SSH_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 8m
          script: |
            set -e
            git config --global --add safe.directory /opt/kayroslab
            cd /opt/kayroslab
            git fetch origin main
            git reset --hard origin/main
            find deploy/ovh-vps -name "*.sh" -exec sed -i 's/\r$//' {} \;

            apt-get update -qq
            apt-get install -y -qq certbot python3-certbot-nginx

            APP_DIR=/opt/kayroslab bash deploy/ovh-vps/deploy-www.sh

            certbot --nginx \
              -d www.kayroslab.com \
              --non-interactive \
              --agree-tos \
              --email contact@kayroslab.com \
              --redirect

            APP_DIR=/opt/kayroslab bash deploy/ovh-vps/deploy-www.sh
            nginx -t && systemctl reload nginx
            certbot certificates
            systemctl enable --now certbot.timer || true
            echo "SSL configure pour www.kayroslab.com"
