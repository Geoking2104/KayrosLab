name: Core tests

on:
  push:
    branches: [main]
    paths:
      - 'core/**'
      - '.github/workflows/core-tests.yml'
  pull_request:
    branches: [main]
    paths:
      - 'core/**'
      - '.github/workflows/core-tests.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run core unit + integration tests
        working-directory: core
        run: node --test
