<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <title>KayrosLab</title>
  <script>
    (function () {
      var path = location.pathname.replace(/\/+$/, "");
      if (path.indexOf("/salon") === 0) {
        var hash = /\/agents$/.test(path) ? "#agents" : "";
        location.replace("/salon/" + location.search + hash);
        return;
      }
      location.replace("/" + location.search + location.hash);
    })();
  </script>
  <link rel="stylesheet" href="./tokens.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./tokens.css">
  <link rel="stylesheet" href="./site.css">
  <link rel="icon" href="./assets/logo-kayroslab.png" type="image/png">
  <link rel="icon" href="./assets/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="./assets/apple-touch-icon.png">
  <meta name="theme-color" content="#f3f2f2">
  <meta property="og:image" content="https://www.kayroslab.com/assets/og-image.png">
</head>
<body>
  <p><a href="/">KayrosLab</a></p>
</body>
</html>
