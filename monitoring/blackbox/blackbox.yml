# Sonde HTTP de /health : 2xx + corps JSON {"ok":true,...}.
modules:
  kayros_health:
    prober: http
    timeout: 10s
    http:
      method: GET
      valid_status_codes: [200]
      preferred_ip_protocol: ip4
      fail_if_body_not_matches_regexp:
        - '"ok"\s*:\s*true'
      headers:
        User-Agent: kayros-blackbox/1.0
