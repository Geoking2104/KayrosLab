<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KayrosLab — Portfolio</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Geist:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./tokens.css">
<script>tailwind.config={theme:{extend:{fontFamily:{display:['Space Grotesk','sans-serif'],body:['Geist','system-ui','sans-serif']}}}};</script>
</head>
<body class="bg-white text-slate-900 antialiased font-body">
<header class="border-b border-slate-200">
  <div class="max-w-6xl mx-auto px-4 py-4 flex items-center justify-between gap-3 flex-wrap">
    <a href="./kayroslab-complete-with-ai-agents.html" class="font-display font-bold text-lg">KayrosLab <span class="text-sky-600 text-sm">Portfolio</span></a>
    <div class="flex gap-3 text-sm">
      <a href="./portfolio-dormant.html" class="text-amber-600 font-semibold">Dormantes</a>
      <a href="./ontology-explorer.html" class="text-sky-600 font-semibold">Ontologie</a>
      <a href="./cycle-timeline.html" class="text-sky-600 font-semibold">Cycle SSE</a>
    </div>
  </div>
</header>
<main class="max-w-6xl mx-auto px-4 py-8 space-y-4">
  <h1 class="font-display text-2xl font-bold">Portefeuille kanban</h1>
  <p class="text-sm text-slate-500">Colonnes = stages du cycle · auth Bearer requise.</p>
  <div class="rounded-2xl border border-slate-200 p-4 grid sm:grid-cols-3 gap-3">
    <div><label class="text-xs font-bold uppercase text-slate-500">API</label>
      <input id="api" class="w-full rounded-xl border border-slate-200 bg-slate-50 px-3 py-2 text-sm" value="http://localhost:8787" /></div>
    <div><label class="text-xs font-bold uppercase text-slate-500">Bearer</label>
      <input id="token" type="password" class="w-full rounded-xl border border-slate-200 bg-slate-50 px-3 py-2 text-sm" placeholder="JWT" /></div>
    <div class="flex items-end"><button id="btn-load" type="button" class="rounded-full bg-sky-600 text-white font-semibold px-5 py-2 text-sm w-full sm:w-auto">Charger</button></div>
  </div>
  <div id="stats" class="text-xs text-slate-500"></div>
  <div id="board" class="overflow-x-auto"><p class="text-slate-400 text-sm">Chargez le portfolio.</p></div>
</main>
<script>
(function () {
  const $ = (id) => document.getElementById(id);
  function esc(s) { return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
  function headers() {
    const h = { Accept: 'application/json' };
    const t = $('token').value.trim();
    if (t) h.Authorization = 'Bearer ' + t;
    return h;
  }
  async function load() {
    const base = $('api').value.replace(/\/$/, '');
    $('board').innerHTML = '<p class="text-slate-400 text-sm">Chargement…</p>';
    try {
      const r = await fetch(base + '/v1/portfolio', { headers: headers() });
      if (!r.ok) throw new Error('HTTP ' + r.status + (r.status === 401 || r.status === 503 ? ' — auth requise' : ''));
      const j = await r.json();
      const cols = j.columns || [];
      const byStatus = j.byStatus || {};
      $('stats').textContent = 'Total ' + (j.total ?? 0) + ' · ' + Object.entries(byStatus).map(([k,v]) => k + ':' + v).join(' · ');
      $('board').innerHTML = '<div class="flex gap-3 min-w-max pb-2">' + cols.map((c) =>
        '<div class="w-56 shrink-0 rounded-2xl border border-slate-200 bg-slate-50 p-3">'
        + '<div class="font-display font-bold text-sm mb-2 flex justify-between"><span>' + esc(c.stage) + '</span><span class="text-slate-400">' + (c.wip||0) + '</span></div>'
        + (c.ideas || []).map((i) =>
          '<div class="mb-2 rounded-xl bg-white border border-slate-200 p-2 text-xs">'
          + '<div class="font-semibold text-slate-800 line-clamp-2">' + esc(i.title || i.id) + '</div>'
          + '<div class="text-slate-400 mt-1">' + esc(i.status) + '</div></div>'
        ).join('') + '</div>'
      ).join('') + '</div>';
    } catch (e) {
      $('board').innerHTML = '<p class="text-red-600 text-sm">' + esc(e.message) + '</p>';
    }
  }
  $('btn-load').addEventListener('click', load);
  const u = new URL(location.href);
  if (u.searchParams.get('api')) $('api').value = u.searchParams.get('api');
})();
</script>
</body>
</html>
