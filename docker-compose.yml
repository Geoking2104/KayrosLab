# KayrosLab — pile locale / auto-hébergée (P9) : fastify (API) + postgres + console.
#   cp deploy/docker/.env.example .env   # puis renseigner les secrets
#   docker compose up --build            # console : http://localhost:8080/console/
# Le harnais de décision est en mode enforce ; personas/ est monté en lecture seule.
name: kayroslab

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: kayros
      POSTGRES_USER: kayros
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD requis (.env)}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kayros -d kayros"]
      interval: 5s
      timeout: 3s
      retries: 20

  fastify:
    build:
      context: .
      dockerfile: deploy/docker/fastify.Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: "8787"
      DATABASE_URL: postgres://kayros:${POSTGRES_PASSWORD}@postgres:5432/kayros
      KAYROS_REQUIRE_POSTGRES: "true"
      KAYROS_HARNESS_MODE: enforce
      KAYROS_PERSONAS_DIR: /app/personas
      KAYROS_AUTH_SECRET: ${KAYROS_AUTH_SECRET:?KAYROS_AUTH_SECRET requis (.env)}
      KAYROS_CONSOLE_URL: ${KAYROS_CONSOLE_URL:-http://localhost:8080/console/}
    env_file:
      - path: .env
        required: false
    volumes:
      - ./personas:/app/personas:ro
    expose:
      - "8787"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12

  console:
    build:
      context: .
      dockerfile: deploy/docker/console.Dockerfile
    restart: unless-stopped
    depends_on:
      fastify:
        condition: service_healthy
    ports:
      - "${KAYROS_CONSOLE_PORT:-8080}:80"

volumes:
  pgdata:
