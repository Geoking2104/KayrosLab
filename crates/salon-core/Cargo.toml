[package]
name = "salon_core"
version = "0.1.0"
edition = "2021"
description = "Protocole d’un cercle littéraire ou philosophique — KayrosLab Salon"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = true
opt-level = "s"
panic = "abort"
codegen-units = 1
