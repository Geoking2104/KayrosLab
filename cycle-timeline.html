<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KayrosLab — Cycle gouverné (SSE)</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./tokens.css">
<script>tailwind.config={theme:{extend:{fontFamily:{body:['Geist','system-ui','sans-serif'],display:['Space Grotesk','sans-serif'],mono:['Fira Code','monospace']}}}};</script>
<style>
body{margin:0;font-family:var(--font-body,Geist,system-ui,sans-serif);background:#fff;color:#0f172a}
.ev-card{border-left:3px solid #e2e8f0;transition:border-color .15s}
.ev-card[data-type="start"]{border-left-color:#0ea5e9}
.ev-card[data-type="recall"]{border-left-color:#8b5cf6}
.ev-card[data-type="trace"]{border-left-color:#10b981}
.ev-card[data-type="distill"]{border-left-color:#f59e0b}
.ev-card[data-type="synthesis"]{border-left-color:#0369a1}
.ev-card[data-type="gate"]{border-left-color:#ef4444}
.ev-card[data-type="final"]{border-left-color:#059669}
.ev-card[data-type="degraded"]{border-left-color:#f97316}
.ev-card[data-type="error"]{border-left-color:#dc2626}
.badge-quant{font-family:Fira Code,monospace;font-size:10px;background:#e0f2fe;color:#0369a1;padding:2px 6px;border-radius:999px}
.badge-deg{font-size:10px;background:#ffedd5;color:#c2410c;padding:2px 6px;border-radius:999px}
#timeline{max-height:min(70vh,640px);overflow-y:auto}
.mono{font-family:Fira Code,monospace;font-size:11px}
</style>
</head>
<body class="antialiased">
<header class="sticky top-0 z-20 border-b border-slate-200 bg-white/90 backdrop-blur">
  <div class="max-w-5xl mx-auto px-4 py-3 flex items-center justify-between gap-3">
    <a href="./kayroslab-complete-with-ai-agents.html" class="font-display font-bold text-lg tracking-tight text-slate-900">KayrosLab <span class="text-sky-600 text-sm font-semibold">Cycle SSE</span></a>
    <div class="flex items-center gap-2 text-xs">
      <span id="status-pill" class="rounded-full px-3 py-1 bg-slate-100 text-slate-600">idle</span>
      <a href="./kayroslab-complete-with-ai-agents.html" class="text-slate-500 hover:text-sky-600">Démo agents</a>
    </div>
  </div>
</header>

<main class="max-w-5xl mx-auto px-4 py-8 grid grid-cols-1 lg:grid-cols-5 gap-6">
  <section class="lg:col-span-2 space-y-4">
    <div class="rounded-2xl border border-slate-200 bg-white p-5 shadow-sm">
      <h1 class="font-display text-xl font-bold mb-1">Cycle gouverné live</h1>
      <p class="text-sm text-slate-500 mb-4">Stream SSE <code class="mono text-sky-700">POST /v1/cycle/run</code> — mémoire L0–L3, quant, agents.</p>

      <label class="block text-xs font-bold uppercase tracking-wider text-slate-500 mb-1">API base</label>
      <input id="api-base" type="text" value="http://localhost:8787" class="w-full mb-3 rounded-xl border border-slate-200 bg-slate-50 px-3 py-2 text-sm" />

      <label class="block text-xs font-bold uppercase tracking-wider text-slate-500 mb-1">Objectif</label>
      <textarea id="query" rows="4" class="w-full mb-3 rounded-xl border border-slate-200 bg-slate-50 px-3 py-2 text-sm" placeholder="Lancer une offre B2B de maintenance prédictive…">Lancer une offre B2B de maintenance prédictive IoT pour l'industrie européenne</textarea>

      <div class="grid grid-cols-2 gap-2 mb-3">
        <div>
          <label class="block text-[10px] font-bold uppercase text-slate-500 mb-1">Gouvernance</label>
          <select id="governance" class="w-full rounded-lg border border-slate-200 bg-slate-50 px-2 py-2 text-sm">
            <option value="auto" selected>auto</option>
            <option value="supervise">supervise</option>
            <option value="off">off</option>
          </select>
        </div>
        <div>
          <label class="block text-[10px] font-bold uppercase text-slate-500 mb-1">Provider</label>
          <select id="provider" class="w-full rounded-lg border border-slate-200 bg-slate-50 px-2 py-2 text-sm">
            <option value="">défaut serveur</option>
            <option value="mock">mock</option>
            <option value="mistral">mistral</option>
            <option value="anthropic">anthropic</option>
            <option value="ollama">ollama</option>
          </select>
        </div>
      </div>

      <label class="flex items-center gap-2 text-sm mb-2 cursor-pointer">
        <input id="auto-distill" type="checkbox" checked class="accent-sky-600" />
        autoDistill L1 → L2
      </label>
      <label class="flex items-center gap-2 text-sm mb-4 cursor-pointer">
        <input id="stream" type="checkbox" checked class="accent-sky-600" />
        stream SSE
      </label>

      <div class="flex flex-wrap gap-2">
        <button id="btn-run" type="button" class="rounded-full bg-sky-600 hover:bg-sky-500 text-white font-semibold px-5 py-2.5 text-sm">
          <i class="fas fa-play mr-1"></i> Lancer le cycle
        </button>
        <button id="btn-stop" type="button" disabled class="rounded-full border border-slate-200 text-slate-600 font-semibold px-4 py-2.5 text-sm disabled:opacity-40">
          Stop
        </button>
        <button id="btn-clear" type="button" class="rounded-full border border-slate-200 text-slate-500 px-4 py-2.5 text-sm">
          Effacer
        </button>
      </div>
    </div>

    <div class="rounded-2xl border border-slate-200 bg-white p-4 shadow-sm">
      <h2 class="text-xs font-bold uppercase tracking-wider text-slate-500 mb-2">Engine status</h2>
      <pre id="engine-status" class="mono text-slate-600 whitespace-pre-wrap bg-slate-50 rounded-lg p-3 max-h-40 overflow-y-auto">—</pre>
      <button id="btn-status" type="button" class="mt-2 text-xs text-sky-600 font-semibold">Rafraîchir /v1/cycle/status</button>
    </div>

    <div class="rounded-2xl border border-slate-200 bg-slate-950 text-slate-200 p-4 shadow-sm">
      <h2 class="text-xs font-bold uppercase tracking-wider text-sky-400 mb-2">Synthèse / final</h2>
      <div id="final-panel" class="text-sm leading-relaxed whitespace-pre-wrap min-h-[4rem] text-slate-300">En attente…</div>
    </div>
  </section>

  <section class="lg:col-span-3">
    <div class="rounded-2xl border border-slate-200 bg-white p-5 shadow-sm">
      <div class="flex items-center justify-between mb-3">
        <h2 class="font-display font-semibold text-sm">Timeline des agents</h2>
        <span id="event-count" class="text-xs text-slate-400">0 events</span>
      </div>
      <div id="timeline" class="space-y-2">
        <p class="text-sm text-slate-400">Les events <code class="mono">meta → start → recall → trace → distill → synthesis → final</code> apparaîtront ici.</p>
      </div>
    </div>
  </section>
</main>

<script>
(function () {
  const $ = (id) => document.getElementById(id);
  let abortCtrl = null;
  let events = [];

  function setStatus(label, tone) {
    const el = $('status-pill');
    el.textContent = label;
    el.className = 'rounded-full px-3 py-1 text-xs font-semibold ' + ({
      idle: 'bg-slate-100 text-slate-600',
      run: 'bg-sky-100 text-sky-700',
      ok: 'bg-emerald-100 text-emerald-700',
      err: 'bg-red-100 text-red-700',
    }[tone] || 'bg-slate-100 text-slate-600');
  }

  function escapeHtml(s) {
    return String(s ?? '')
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  function formatLine(ev) {
    if (!ev || !ev.type) return '';
    if (ev.type === 'trace') {
      const model = ev.quant?.modelUsed || ev.quant?.agent?.preferredModel || '';
      const quant = ev.quant?.agent?.quant || '';
      return (ev.agent || '?') + (quant ? ' · ' + quant : '') + (model ? ' · ' + model : '');
    }
    if (ev.type === 'start') return 'goal: ' + (ev.goal || '').slice(0, 120);
    if (ev.type === 'recall') return (ev.source || 'memory') + (ev.preview ? ' — ' + String(ev.preview).slice(0, 100) : '');
    if (ev.type === 'distill') return (ev.count || 0) + ' scénario(s) ' + (ev.titles || []).slice(0, 3).join(', ');
    if (ev.type === 'synthesis') return String(ev.output || '').slice(0, 160);
    if (ev.type === 'gate') return (ev.gateType || '') + ' · ' + (ev.gateId || '');
    if (ev.type === 'final') return (ev.status || '') + (ev.answer ? ' — ' + String(ev.answer).slice(0, 120) : '');
    if (ev.type === 'degraded') return (ev.reason || '') + ' ' + (ev.from || '') + ' → ' + (ev.to || '');
    if (ev.type === 'error') return ev.error || '';
    if (ev.type === 'meta') return 'idea ' + (ev.ideaId || '');
    if (ev.type === 'done') return 'stream closed';
    return ev.type;
  }

  function quantBadge(ev) {
    const q = ev?.quant?.agent?.quant || ev?.quant?.global?.quant || (typeof ev?.quant === 'string' ? ev.quant : null);
    if (!q) return '';
    return '<span class="badge-quant">' + escapeHtml(q) + '</span>';
  }

  function renderEvent(ev) {
    const deg = ev.degraded
      ? '<span class="badge-deg">degraded</span>'
      : (ev.type === 'degraded' ? '<span class="badge-deg">' + escapeHtml(ev.reason || 'degraded') + '</span>' : '');
    const body = formatLine(ev);
    const obs = (ev.type === 'trace' && ev.observation)
      ? '<div class="mt-2 mono text-slate-500 max-h-24 overflow-y-auto">' + escapeHtml(String(typeof ev.observation === 'string' ? ev.observation : JSON.stringify(ev.observation)).slice(0, 500)) + '</div>'
      : '';
    return '<article class="ev-card rounded-xl bg-slate-50 px-3 py-2" data-type="' + escapeHtml(ev.type) + '">' +
      '<div class="flex items-center gap-2 flex-wrap">' +
      '<span class="text-[10px] font-bold uppercase tracking-wider text-slate-500">' + escapeHtml(ev.type) + '</span>' +
      quantBadge(ev) + deg +
      (ev.ts ? '<span class="mono text-slate-400 ml-auto">' + escapeHtml(String(ev.ts).slice(11, 19)) + '</span>' : '') +
      '</div>' +
      '<div class="text-sm text-slate-700 mt-0.5">' + escapeHtml(body) + '</div>' + obs +
      '</article>';
  }

  function pushEvent(ev) {
    if (!ev || !ev.type) return;
    events.push(ev);
    const box = $('timeline');
    if (events.length === 1) box.innerHTML = '';
    box.insertAdjacentHTML('beforeend', renderEvent(ev));
    box.scrollTop = box.scrollHeight;
    $('event-count').textContent = events.length + ' events';

    if (ev.type === 'final') {
      $('final-panel').textContent = (ev.status || '') + '\n\n' + (ev.answer || ev.message || '');
    }
    if (ev.type === 'synthesis' && ev.output) {
      $('final-panel').textContent = String(ev.output);
    }
    if (ev.type === 'error') {
      setStatus('error', 'err');
      $('final-panel').textContent = 'Erreur: ' + (ev.error || '');
    }
  }

  async function refreshStatus() {
    const base = $('api-base').value.replace(/\/$/, '');
    try {
      const r = await fetch(base + '/v1/cycle/status');
      const j = await r.json();
      $('engine-status').textContent = JSON.stringify(j, null, 2);
    } catch (e) {
      $('engine-status').textContent = 'unreachable: ' + e.message;
    }
  }

  async function parseSseStream(res) {
    const reader = res.body.getReader();
    const dec = new TextDecoder();
    let buf = '';
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      const parts = buf.split('\n\n');
      buf = parts.pop() || '';
      for (const chunk of parts) {
        const line = chunk.split('\n').find((l) => l.startsWith('data:'));
        if (!line) continue;
        try {
          pushEvent(JSON.parse(line.slice(5).trim()));
        } catch { /* skip */ }
      }
    }
  }

  async function runCycle() {
    const base = $('api-base').value.replace(/\/$/, '');
    const query = $('query').value.trim();
    if (!query) { alert('Objectif requis'); return; }

    events = [];
    $('timeline').innerHTML = '<p class="text-sm text-slate-400">Connexion…</p>';
    $('final-panel').textContent = 'En cours…';
    setStatus('running', 'run');
    $('btn-run').disabled = true;
    $('btn-stop').disabled = false;

    const body = {
      query,
      governance: $('governance').value,
      autoDistill: $('auto-distill').checked,
      stream: $('stream').checked,
      llmPlan: true,
    };
    const provider = $('provider').value;
    if (provider) body.provider = provider;

    abortCtrl = new AbortController();
    try {
      const res = await fetch(base + '/v1/cycle/run', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', Accept: body.stream ? 'text/event-stream' : 'application/json' },
        body: JSON.stringify(body),
        signal: abortCtrl.signal,
      });

      if (!res.ok) {
        const err = await res.json().catch(() => ({ error: res.statusText }));
        pushEvent({ type: 'error', error: err.error || ('HTTP ' + res.status), ts: new Date().toISOString() });
        setStatus('error', 'err');
        return;
      }

      const ct = res.headers.get('content-type') || '';
      if (body.stream && ct.includes('text/event-stream')) {
        await parseSseStream(res);
        setStatus('done', 'ok');
      } else {
        const j = await res.json();
        (j.events || []).forEach(pushEvent);
        if (j.answer) $('final-panel').textContent = (j.status || '') + '\n\n' + j.answer;
        setStatus(j.status || 'ok', 'ok');
      }
      refreshStatus();
    } catch (e) {
      if (e.name === 'AbortError') {
        setStatus('stopped', 'idle');
        pushEvent({ type: 'error', error: 'aborted', ts: new Date().toISOString() });
      } else {
        setStatus('error', 'err');
        pushEvent({ type: 'error', error: e.message, ts: new Date().toISOString() });
      }
    } finally {
      $('btn-run').disabled = false;
      $('btn-stop').disabled = true;
      abortCtrl = null;
    }
  }

  $('btn-run').addEventListener('click', runCycle);
  $('btn-stop').addEventListener('click', () => abortCtrl?.abort());
  $('btn-clear').addEventListener('click', () => {
    events = [];
    $('timeline').innerHTML = '<p class="text-sm text-slate-400">Timeline effacée.</p>';
    $('final-panel').textContent = 'En attente…';
    $('event-count').textContent = '0 events';
    setStatus('idle', 'idle');
  });
  $('btn-status').addEventListener('click', refreshStatus);

  // query param ?api=
  const u = new URL(location.href);
  if (u.searchParams.get('api')) $('api-base').value = u.searchParams.get('api');

  refreshStatus();
})();
</script>
</body>
</html>
