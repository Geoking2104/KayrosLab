<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Salon</title>
  <script>
  (function () {
    var SRC = "https://cdn.jsdelivr.net/gh/Geoking2104/KayrosLab@f42a6b6b5e1af1847e974a1954132e889ed9854d/salon/index.html";
    fetch(SRC, { cache: "force-cache" }).then(function (r) { return r.text(); }).then(function (html) {
      html = html.replace(
        "Un cercle est une table. Vous y faites entrer des auteurs — 54 déjà, ou un nouveau, pourvu qu’il ait cinq œuvres libres. Chacun est un convive : un @, une mémoire, une voix.",
        "Un cercle est une table. Vous y faites entrer des auteurs — {n} déjà, ou un nouveau, pourvu qu’il ait cinq œuvres libres. Chacun est un convive : un @, une mémoire, une voix."
      );
      html = html.replace(
        "A circle is a table. You bring authors in — 54 already, or a new one, provided they have five public-domain works. Each is a guest: an @, a memory, a voice.",
        "A circle is a table. You bring authors in — {n} already, or a new one, provided they have five public-domain works. Each is a guest: an @, a memory, a voice."
      );
      html = html.replace(
        '<p class="lead" data-i18n="circle.what">',
        '<p class="lead" data-i18n="circle.what" data-n="54">'
      );
      html = html.replace(
        "    .create-box[hidden] { display: none !important; }",
        "    .import-box { margin: 1.1rem 0 0; padding: 1rem 1.1rem 1.15rem; border: 1px solid color-mix(in oklch, var(--ink) 14%, transparent); background: color-mix(in oklch, var(--paper) 92%, var(--accent)); }\n    .import-box h2 { margin: 0 0 0.35rem; font-size: 1.15rem; }\n    .import-box .hint, .import-meta { color: var(--muted); font-size: 0.92rem; }\n    .import-box .row { display: flex; gap: 0.5rem; flex-wrap: wrap; align-items: center; }\n    .import-box input[type=search] { flex: 1; min-width: 12rem; }\n    .import-hits, .import-works { list-style: none; margin: 0.7rem 0 0; padding: 0; display: grid; gap: 0.28rem; }\n    .import-hits button { width: 100%; text-align: left; background: transparent; border: 1px solid color-mix(in oklch, var(--ink) 12%, transparent); padding: 0.45rem 0.6rem; cursor: pointer; color: inherit; font: inherit; }\n    .import-hits button.is-on, .import-hits button:hover { border-color: var(--accent); }\n    .import-hits button span, .import-works small { display: block; color: var(--muted); font-size: 0.82rem; }\n    .import-works label { display: flex; gap: 0.55rem; align-items: flex-start; padding: 0.28rem 0; }\n    .import-box .err { color: #8b1e1e; margin: 0.5rem 0 0; }\n    .create-box[hidden], .import-box[hidden] { display: none !important; }"
      );
      html = html.replace(
        '<button class="btn" type="button" id="add-author" data-i18n="create.add">Ajouter un auteur</button>',
        '<button class="btn" type="button" id="add-author" data-i18n="create.add">Ajouter un auteur</button>\n          <button class="btn ghost" type="button" id="import-author-btn">Importer</button>'
      );
      var box = [
        '        <div class="import-box" id="import-author" hidden>',
        '          <h2>Importer un auteur du domaine public</h2>',
        '          <p class="hint">Base ouverte Project Gutenberg. Choisissez un auteur, puis exactement cinq œuvres — elles complètent le catalogue et deviennent la mémoire de l’agent.</p>',
        '          <form id="import-search" class="row">',
        '            <input id="import-q" type="search" minlength="2" required placeholder="Hugo, Austen, Montesquieu…" />',
        '            <button class="btn" type="submit">Chercher</button>',
        '            <button class="btn ghost" type="button" id="import-cancel">Annuler</button>',
        '          </form>',
        '          <p class="import-meta" id="import-status" hidden></p>',
        '          <p class="err" id="import-error" hidden></p>',
        '          <ul class="import-hits" id="import-authors" hidden></ul>',
        '          <div id="import-pick" hidden>',
        '            <p class="import-meta" id="import-pick-head"></p>',
        '            <ul class="import-works" id="import-works"></ul>',
        '            <div class="row" style="margin-top:0.7rem">',
        '              <button class="btn" type="button" id="import-commit" disabled>Constituer la mémoire (5)</button>',
        '            </div>',
        '          </div>',
        '        </div>'
      ].join("\n");
      html = html.replace('<form class="create-box" id="create-author" hidden>', box + '\n        <form class="create-box" id="create-author" hidden>');
      var hook = "    document.getElementById(\"add-author\")?.addEventListener(\"click\", () => {";
      var js = [
        "    function paintCatalogCount() {",
        "      const n = authors.length;",
        "      document.querySelectorAll('[data-i18n=\"flows\"], [data-i18n=\"circle.what\"]').forEach((el) => {",
        "        el.dataset.n = String(n);",
        "        el.textContent = msg(el.getAttribute('data-i18n'), { n: n });",
        "      });",
        "      const nEl = document.getElementById('agent-n');",
        "      if (nEl && !document.getElementById('agent-q')?.value && !document.getElementById('agent-kind')?.value) {",
        "        nEl.textContent = String(n);",
        "      }",
        "    }",
        "    const _applyI18n = applyI18n;",
        "    applyI18n = function () {",
        "      document.querySelectorAll('[data-i18n=\"flows\"], [data-i18n=\"circle.what\"]').forEach((el) => {",
        "        el.dataset.n = String(authors.length);",
        "      });",
        "      _applyI18n();",
        "      paintCatalogCount();",
        "    };",
        "    const _renderAgents = renderAgents;",
        "    renderAgents = function () {",
        "      _renderAgents();",
        "      paintCatalogCount();",
        "    };",
        "    setTimeout(function hookRestore() {",
        "      if (typeof restoreExtras !== 'function') { setTimeout(hookRestore, 30); return; }",
        "      const _restoreExtras = restoreExtras;",
        "      restoreExtras = function (state) { _restoreExtras(state); paintCatalogCount(); };",
        "      paintCatalogCount();",
        "    }, 0);",
        "    document.getElementById('create-author')?.addEventListener('submit', () => {",
        "      setTimeout(() => { try { persistSoon(); paintCatalogCount(); renderGuests(); } catch (e) {} }, 0);",
        "    });",
        "    (function salonImport() {",
        "      const importState = { authors: [], selected: null, works: [] };",
        "      function slugHandle(name) { return String(name || '').toLowerCase().normalize('NFD').replace(/[\\u0300-\\u036f]/g, '').replace(/[^a-z0-9]+/g, '').slice(0, 18) || 'auteur'; }",
        "      function textUrlOf(book) { const f = book.formats || {}; return f['text/plain; charset=utf-8'] || f['text/plain'] || (Object.entries(f).find(([k]) => k.startsWith('text/plain')) || [])[1] || ''; }",
        "      function uniqueHandle(base) { let id = base, n = 2; while (authors.some((a) => a.id === id)) { id = base + n; n += 1; } return id; }",
        "      function setErr(t) { const el = document.getElementById('import-error'); if (!el) return; el.hidden = !t; el.textContent = t || ''; }",
        "      function setSt(t) { const el = document.getElementById('import-status'); if (!el) return; el.hidden = !t; el.textContent = t || ''; }",
        "      function commitAuthor(entry) {",
        "        if (authors.some((a) => a.id === entry.id || a.name === entry.name || a.nameEn === entry.nameEn)) {",
        "          const existing = authors.find((a) => a.id === entry.id || a.name === entry.name || a.nameEn === entry.nameEn);",
        "          if (existing) {",
        "            existing.works = entry.works; existing.memory = entry.memory; existing.source = entry.source;",
        "            paintCatalogCount(); persistSoon(); fillFiche(existing.id); show('fiche', existing.id); return existing;",
        "          }",
        "        }",
        "        authors.push(entry);",
        "        renderGuests(); renderAgents(); persistSoon(); paintCatalogCount();",
        "        fillFiche(entry.id); show('fiche', entry.id);",
        "        return entry;",
        "      }",
        "      document.getElementById('import-author-btn')?.addEventListener('click', () => {",
        "        const box = document.getElementById('import-author');",
        "        const c = document.getElementById('create-author'); if (c) c.hidden = true;",
        "        box.hidden = !box.hidden; if (!box.hidden) document.getElementById('import-q')?.focus();",
        "      });",
        "      document.getElementById('import-cancel')?.addEventListener('click', () => { document.getElementById('import-author').hidden = true; });",
        "      document.getElementById('import-search')?.addEventListener('submit', async (e) => {",
        "        e.preventDefault();",
        "        const q = String(document.getElementById('import-q').value || '').trim(); if (q.length < 2) return;",
        "        setErr(''); setSt('Recherche\u2026');",
        "        document.getElementById('import-authors').hidden = true; document.getElementById('import-pick').hidden = true;",
        "        try {",
        "          const res = await fetch('https://gutendex.com/books?search=' + encodeURIComponent(q) + '&copyright=false');",
        "          if (!res.ok) throw new Error('http'); const json = await res.json(); const by = new Map();",
        "          (json.results || []).forEach((book) => { (book.authors || []).forEach((a) => {",
        "            const name = String(a.name || '').trim(); if (!name) return; const key = name.toLowerCase();",
        "            if (!by.has(key)) by.set(key, { name: name, birth: a.birth_year, death: a.death_year, books: [] });",
        "            const row = by.get(key); if (textUrlOf(book) && !row.books.some((b) => b.id === book.id)) row.books.push({ id: book.id, title: book.title, url: textUrlOf(book) });",
        "          }); });",
        "          importState.authors = [...by.values()].filter((a) => a.books.length >= 1).sort((a, b) => b.books.length - a.books.length);",
        "          const list = document.getElementById('import-authors');",
        "          if (!importState.authors.length) { setSt('Aucun auteur libre trouv\u00e9.'); return; }",
        "          setSt(importState.authors.length + ' auteurs trouv\u00e9s');",
        "          list.innerHTML = importState.authors.map((a, i) => { const era = [a.birth, a.death].filter(Boolean).join('\u2013') || 'domaine public'; return '<li><button type=\"button\" data-i=\"' + i + '\">' + esc(a.name) + '<span>' + esc(era) + ' \u00b7 ' + a.books.length + ' \u0153uvre(s)</span></button></li>'; }).join('');",
        "          list.hidden = false;",
        "        } catch (err) { setSt(''); setErr('La base ouverte n\u2019a pas r\u00e9pondu.'); }",
        "      });",
        "      document.getElementById('import-authors')?.addEventListener('click', async (e) => {",
        "        const btn = e.target.closest('button[data-i]'); if (!btn) return;",
        "        document.querySelectorAll('#import-authors button').forEach((b) => b.classList.toggle('is-on', b === btn));",
        "        const picked = importState.authors[Number(btn.dataset.i)]; if (!picked) return; importState.selected = picked; setSt('Recherche\u2026');",
        "        try {",
        "          const res = await fetch('https://gutendex.com/books?search=' + encodeURIComponent(picked.name) + '&copyright=false');",
        "          const json = res.ok ? await res.json() : { results: [] }; const books = []; const seen = new Set();",
        "          picked.books.forEach((b) => { seen.add(b.id); books.push(b); });",
        "          const surname = picked.name.split(',')[0].toLowerCase();",
        "          (json.results || []).forEach((book) => { const url = textUrlOf(book); if (!url || seen.has(book.id)) return; const names = (book.authors || []).map((a) => a.name.toLowerCase()); if (!names.some((n) => n.includes(surname) || picked.name.toLowerCase().includes(n.split(',')[0]))) return; seen.add(book.id); books.push({ id: book.id, title: book.title, url: url }); });",
        "          importState.works = books.slice(0, 24);",
        "          document.getElementById('import-works').innerHTML = importState.works.map((w, i) => '<li><label><input type=\"checkbox\" data-i=\"' + i + '\" /><span>' + esc(w.title) + '<small>Gutenberg #' + w.id + '</small></span></label></li>').join('');",
        "          document.getElementById('import-pick-head').textContent = '\u0152uvres de ' + picked.name + ' \u2014 cochez 5';",
        "          document.getElementById('import-pick').hidden = false; document.getElementById('import-commit').disabled = true; setSt('');",
        "        } catch (err) { setErr('La base ouverte n\u2019a pas r\u00e9pondu.'); }",
        "      });",
        "      document.getElementById('import-works')?.addEventListener('change', () => {",
        "        const boxes = [...document.querySelectorAll('#import-works input[type=checkbox]')];",
        "        const checked = boxes.filter((b) => b.checked); if (checked.length > 5) checked.slice(5).forEach((b) => { b.checked = false; });",
        "        document.getElementById('import-commit').disabled = [...document.querySelectorAll('#import-works input[type=checkbox]:checked')].length !== 5;",
        "      });",
        "      document.getElementById('import-commit')?.addEventListener('click', async () => {",
        "        const picked = importState.selected; if (!picked) return;",
        "        const works = [...document.querySelectorAll('#import-works input[type=checkbox]:checked')].map((b) => importState.works[Number(b.dataset.i)]).filter(Boolean);",
        "        if (works.length !== 5) { setErr('Choisissez exactement cinq œuvres.'); return; }",
        "        setErr(''); setSt('Chargement des textes\u2026'); const memory = [];",
        "        for (const work of works) { let sample = ''; try { const res = await fetch(work.url); if (res.ok) { const raw = (await res.text()).replace(/\\u0000/g, ''); const start = raw.search(/\\r?\\n\\r?\\n/); sample = raw.slice(Math.max(0, start), Math.max(0, start) + 1800).trim(); } } catch (e) {} memory.push({ title: work.title, gutenbergId: work.id, url: work.url, sample: sample.slice(0, 1200) }); }",
        "        const display = picked.name.replace(/^([^,]+),\\s*(.+)$/, '$2 $1');",
        "        const handle = uniqueHandle(slugHandle(picked.name.split(',')[0]));",
        "        const era = [picked.birth, picked.death].filter(Boolean).join('\u2013') || 'domaine public';",
        "        document.getElementById('import-author').hidden = true;",
        "        commitAuthor({ id: handle, name: display, nameEn: picked.name, kind: 'écrivain', blurb: 'Voix constituée depuis cinq œuvres du domaine public (Project Gutenberg).', blurbEn: 'Voice built from five public-domain works (Project Gutenberg).', era: era, eraEn: era, avatar: '', monogram: (display || 'A').slice(0, 1).toUpperCase(), method: 'auto', works: works.map((w) => w.title), memory: memory, source: 'gutenberg' });",
        "        setSt('');",
        "      });",
        "    })();",
        "    paintCatalogCount();",
        "    " + hook
      ].join("\n");
      html = html.replace(hook, js);
      document.open();
      document.write(html);
      document.close();
    }).catch(function () {
      document.body.innerHTML = '<p style="font:1.1rem/1.45 Georgia,serif;margin:2rem">Le salon n\u2019a pas pu s\u2019ouvrir. R\u00e9essayez.</p>';
    });
  })();
  </script>
</head>
<body>
  <p style="font:1rem/1.45 Georgia,serif;margin:2rem">Ouverture du salon\u2026</p>
</body>
</html>
