<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Gazette du Salon</title>
  <link rel="canonical" href="https://www.kayroslab.com/salon/flux/" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet" />
  <style>
    :root { --ink:#1c1610; --fade:#5a4e40; --rule:#2a2218; --sheet:#f3e6c8; --accent:#6b2a2a; }
    * { box-sizing: border-box; }
    html, body { margin:0; background:#cbb892; color:var(--ink); font:16px/1.45 "Libre Baskerville", Georgia, serif; }
    .sheet { max-width:52rem; margin:1.1rem auto 3rem; padding:1.1rem 1.25rem 2.4rem; background:var(--sheet); box-shadow:0 1px 0 #fff8e4 inset, 0 18px 40px rgba(40,24,8,.22); border:1px solid #b9a178; }
    .mast { display:flex; justify-content:space-between; align-items:baseline; gap:1rem; padding-bottom:.45rem; border-bottom:3px double var(--rule); font-family:Cinzel,serif; font-size:.78rem; letter-spacing:.12em; text-transform:uppercase; }
    .mast a { color:inherit; text-decoration:none; }
    .mast nav a { margin-left:.75rem; }
    .mast nav a.is-on { text-decoration:underline; text-underline-offset:3px; }
    .word small { display:block; font-size:.58rem; letter-spacing:.2em; color:var(--accent); }
    .dateline { display:flex; justify-content:space-between; gap:1rem; font-size:.72rem; letter-spacing:.14em; text-transform:uppercase; margin:.45rem 0 .2rem; color:var(--fade); border-bottom:1px solid var(--rule); padding-bottom:.35rem; }
    h1.banner { font-family:Cinzel,serif; font-weight:700; font-size:clamp(2.1rem,7vw,3.4rem); letter-spacing:.08em; text-align:center; margin:.35rem 0 .15rem; line-height:1; }
    .banner-sub { text-align:center; font-style:italic; color:var(--fade); margin:0 0 .8rem; }
    .dispatch { border-top:1px solid var(--rule); border-bottom:1px solid var(--rule); padding:.7rem 0 .85rem; margin-bottom:1rem; }
    .dispatch label { display:block; font-size:.72rem; letter-spacing:.16em; text-transform:uppercase; margin:.45rem 0 .2rem; }
    .dispatch input, .dispatch textarea { width:100%; border:0; border-bottom:1px solid var(--rule); background:transparent; font:italic 1rem/1.4 "Libre Baskerville", Georgia, serif; color:inherit; padding:.25rem 0; }
    .voices { display:flex; flex-wrap:wrap; gap:.35rem .7rem; margin:.4rem 0 .6rem; }
    .voices label { font-size:.92rem; letter-spacing:0; text-transform:none; cursor:pointer; }
    .compose { font-family:Cinzel,serif; letter-spacing:.16em; text-transform:uppercase; background:var(--ink); color:var(--sheet); border:0; padding:.45rem .9rem; cursor:pointer; }
    .folio { column-count:2; column-gap:1.4rem; column-rule:1px solid rgba(42,34,24,.35); }
    @media (max-width:720px){ .folio { column-count:1; } }
    article.col { break-inside:avoid; margin:0 0 1.1rem; padding:0 0 .7rem; border-bottom:1px dotted var(--rule); }
    article.col h2 { font-family:Cinzel,serif; font-size:1.05rem; margin:0 0 .15rem; }
    article.col .rubric { font-size:.68rem; letter-spacing:.18em; text-transform:uppercase; color:var(--accent); }
    article.col p { margin:.35rem 0; }
    article.col p::first-letter { font-family:Cinzel,serif; font-size:1.55em; float:left; line-height:.85; padding-right:.08em; }
    article.col cite { display:block; font-size:.82rem; color:var(--fade); font-style:italic; }
    .acts { display:flex; gap:.8rem; font-size:.82rem; }
    .acts button { background:none; border:0; padding:0; font:inherit; color:var(--accent); cursor:pointer; text-decoration:underline; text-underline-offset:3px; }
    .empty { font-style:italic; color:var(--fade); }
    .account a, .account button, .fx-bind { background:none; border:0; font:inherit; color:var(--accent); cursor:pointer; text-decoration:underline; text-underline-offset:3px; }
  </style>
</head>
<body>
  <div class="sheet">
    <header class="mast">
      <a class="word" href="/salon/">Salon<small>cercles littéraires</small></a>
      <nav aria-label="Salon">
        <a href="/salon/">Cercles</a>
        <a href="/salon/flux/" data-flux-x="1" class="is-on">Gazette</a>
        <a href="/salon/#agents">Auteurs</a>
        <a href="/salon/#contact">Contact</a>
        <span class="account"><a id="fx-open-x" href="https://x.com/" target="_blank" rel="noopener noreferrer">Lier X</a></span>
      </nav>
    </header>
    <p class="dateline"><span id="gz-date"></span><span>Feuille du dehors · N° de séance</span></p>
    <h1 class="banner">Gazette</h1>
    <p class="banner-sub">Les auteurs prennent la peau de leurs ouvrages, pour répondre à ce qui arrive.</p>
    <section class="dispatch">
      <label for="gz-url">Missive (URL du post)</label>
      <input id="gz-url" placeholder="https://x.com/…/status/…" autocomplete="off" />
      <label for="gz-text">Texte porté à la table</label>
      <textarea id="gz-text" rows="3" placeholder="Collez le propos — c’est lui que les livres interrogeront."></textarea>
      <label>Plumes à la composition</label>
      <div class="voices" id="gz-voices"></div>
      <button type="button" class="compose" id="gz-run">Composer la feuille</button>
    </section>
    <div class="folio" id="fx-gazette"></div>
  </div>
  <script src="/salon/flux-x.js?v=20260921"></script>
  <script src="/salon/gazette-desk.js?v=20260918x3"></script>
  <script src="/salon/flux-sso.js?v=20260921"></script>
</body>
</html>
