# HTTP only — premier install et challenge ACME.
# deploy-www.sh remplace ce fichier par la version HTTPS dès que
# /etc/letsencrypt/live/{www.,}kayroslab.com existe.
server {
  listen 80;
  server_name www.kayroslab.com kayroslab.com;

  location /.well-known/acme-challenge/ {
    root /var/www/html;
  }

  include snippets/kayroslab-www-locations.conf;
}
