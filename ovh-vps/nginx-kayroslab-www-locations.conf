# Inclus dans le vhost www. Ne pas charger seul.
root /var/www/kayroslab;
index index.html;

charset utf-8;
gzip on;
gzip_types text/plain text/css application/javascript application/json image/svg+xml application/wasm;

add_header X-Content-Type-Options nosniff always;
add_header Referrer-Policy strict-origin-when-cross-origin always;

location / {
  try_files $uri $uri/ =404;
}

location /console/ {
  try_files $uri $uri/ /console/index.html;
}

# Salon : page statique et packs mémoire (remplace l'ancien renvoi vers l'accueil).
location = /salon {
  return 301 /salon/;
}

location ^~ /salon/ {
  try_files $uri $uri/ /salon/index.html;
}

location = /salon/index.html {
  add_header Cache-Control "no-cache";
}

location ^~ /salon/kb/ {
  expires 1h;
  add_header Cache-Control "public, max-age=3600";
  try_files $uri =404;
}

location /positionner-app/ {
  try_files $uri $uri/ /positionner-app/index.html;
}

location ~* \.wasm$ {
  default_type application/wasm;
  expires 7d;
  add_header Cache-Control "public";
  try_files $uri =404;
}

location ~* \.(js|css|png|jpe?g|gif|svg|webp|woff2|ico)$ {
  expires 7d;
  add_header Cache-Control "public";
  try_files $uri =404;
}
