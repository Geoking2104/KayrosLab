# n8n auto-hébergé pour l'intégration Salesforce ↔ KayrosLab (PoC).
# Cible : le VPS OVH actuel (51.210.9.71), derrière nginx + Let's Encrypt
# (nginx-n8n.kayroslab.com.conf). Guide : README.md.
#
#   cd /opt/kayroslab/integrations/n8n
#   cp .env.example .env && nano .env        # mots de passe + N8N_ENCRYPTION_KEY
#   docker compose up -d && docker compose logs -f n8n
#
# Réseau `host` : n8n joint le Postgres local du VPS sur 127.0.0.1:5432 sans
# ouvrir Postgres au réseau Docker, et n'écoute lui-même que sur 127.0.0.1:5678
# (N8N_LISTEN_ADDRESS) : seul nginx l'expose, en HTTPS.
services:
  n8n:
    # Version épinglée : une mise à jour se fait volontairement (voir README).
    image: docker.n8n.io/n8nio/n8n:2.42.6
    container_name: kayros-n8n
    restart: unless-stopped
    network_mode: host
    # Budget mémoire du VPS : ~512 Mo pour n8n (le backend KayrosLab et Postgres
    # gardent la priorité). Le tas Node est borné en dessous de la limite.
    mem_limit: 512m
    memswap_limit: 512m
    env_file: .env
    environment:
      N8N_LISTEN_ADDRESS: 127.0.0.1
      N8N_PORT: 5678
      N8N_HOST: ${N8N_DOMAIN:-n8n.kayroslab.com}
      N8N_PROTOCOL: https
      N8N_PROXY_HOPS: 1
      # URL publique des webhooks (n8n 2.42 : N8N_WEBHOOK_URL remplace WEBHOOK_URL, déprécié).
      N8N_WEBHOOK_URL: https://${N8N_DOMAIN:-n8n.kayroslab.com}/
      N8N_EDITOR_BASE_URL: https://${N8N_DOMAIN:-n8n.kayroslab.com}/
      N8N_SECURE_COOKIE: "true"
      GENERIC_TIMEZONE: Europe/Paris
      TZ: Europe/Paris
      NODE_OPTIONS: --max-old-space-size=384
      # Base : Postgres local (base et rôle dédiés `n8n`, cf. init-n8n-db.sql).
      # Repli SQLite : mettre DB_TYPE=sqlite dans .env (fichier dans le volume).
      DB_TYPE: ${DB_TYPE:-postgresdb}
      DB_POSTGRESDB_HOST: 127.0.0.1
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: ${N8N_DB_NAME:-n8n}
      DB_POSTGRESDB_USER: ${N8N_DB_USER:-n8n}
      DB_POSTGRESDB_PASSWORD: ${N8N_DB_PASSWORD:-}
      # Historique d'exécutions limité à 7 jours (disque et RGPD).
      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_MAX_AGE: 168
      EXECUTIONS_DATA_SAVE_ON_SUCCESS: none
      EXECUTIONS_DATA_SAVE_ON_ERROR: all
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_VERSION_NOTIFICATIONS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      N8N_HIRING_BANNER_ENABLED: "false"
    volumes:
      - n8n_data:/home/node/.n8n
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:5678/healthz >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s

volumes:
  n8n_data:
    name: kayros_n8n_data
