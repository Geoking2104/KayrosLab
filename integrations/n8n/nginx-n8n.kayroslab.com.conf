# n8n.kayroslab.com → n8n (127.0.0.1:5678), même VPS que api.kayroslab.com.
#
#   sudo cp nginx-n8n.kayroslab.com.conf /etc/nginx/sites-available/n8n.kayroslab.com
#   sudo ln -sf /etc/nginx/sites-available/n8n.kayroslab.com /etc/nginx/sites-enabled/
#   sudo htpasswd -c /etc/nginx/.htpasswd-n8n geoffroy      # paquet apache2-utils
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d n8n.kayroslab.com --redirect --agree-tos -m contact@kayroslab.com -n
#
# certbot ajoute ensuite le bloc 443 (certificat Let's Encrypt) et la redirection
# HTTP → HTTPS ; le renouvellement passe par certbot.timer, déjà actif sur le VPS.
#
# Deux verrous sur l'éditeur : authentification HTTP basique (nginx) puis compte
# propriétaire n8n. Les URL de webhook restent publiques (KayrosLab et les
# outils externes les appellent sans mot de passe) : elles sont protégées par la
# signature HMAC vérifiée dans le workflow.

map $http_upgrade $n8n_connection_upgrade {
  default upgrade;
  ''      close;
}

server {
  listen 80;
  server_name n8n.kayroslab.com;

  # Laisse passer le challenge ACME (certbot) avant la bascule HTTPS.
  location /.well-known/acme-challenge/ {
    root /var/www/html;
  }

  client_max_body_size 16m;

  # Webhooks de production, de test (éditeur) et de reprise (nœud Wait) : sans mot de passe.
  location ~ ^/(webhook|webhook-test|webhook-waiting)/ {
    proxy_pass http://127.0.0.1:5678;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
  }

  # Retour OAuth de Salesforce vers n8n (navigateur déjà authentifié, mais
  # certains navigateurs ne renvoient pas l'en-tête Basic sur une redirection).
  location /rest/oauth2-credential/callback {
    proxy_pass http://127.0.0.1:5678;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Éditeur n8n.
  location / {
    auth_basic "n8n KayrosLab";
    auth_basic_user_file /etc/nginx/.htpasswd-n8n;

    proxy_pass http://127.0.0.1:5678;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Mises à jour en direct de l'éditeur (WebSocket /rest/push).
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $n8n_connection_upgrade;
    proxy_read_timeout 300s;
    proxy_buffering off;
  }
}
