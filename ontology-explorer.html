<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KayrosLab — Ontologie Positionner</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Geist:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./tokens.css">
<script>tailwind.config={theme:{extend:{fontFamily:{display:['Space Grotesk','sans-serif'],body:['Geist','system-ui','sans-serif']}}}};</script>
</head>
<body class="bg-white text-slate-900 antialiased font-body">
<header class="border-b border-slate-200">
  <div class="max-w-5xl mx-auto px-4 py-4 flex items-center justify-between gap-3 flex-wrap">
    <a href="./kayroslab-complete-with-ai-agents.html" class="font-display font-bold text-lg">KayrosLab <span class="text-sky-600 text-sm">Ontologie</span></a>
    <div class="flex gap-3 text-sm">
      <a href="./portfolio-board.html" class="text-sky-600 font-semibold">Portfolio</a>
      <a href="./cycle-timeline.html" class="text-sky-600 font-semibold">Cycle SSE</a>
    </div>
  </div>
</header>
<main class="max-w-5xl mx-auto px-4 py-8 space-y-6">
  <div>
    <h1 class="font-display text-2xl font-bold">Ontologie Positionner</h1>
    <p class="text-sm text-slate-500 mt-1">Entités tech & business + relations — source <code>core/positionning/ontology.mjs</code>.</p>
  </div>
  <div class="rounded-2xl border border-slate-200 p-4 flex flex-wrap gap-3 items-end">
    <div class="flex-1 min-w-[200px]">
      <label class="block text-xs font-bold uppercase text-slate-500 mb-1">API base</label>
      <input id="api" class="w-full rounded-xl border border-slate-200 bg-slate-50 px-3 py-2 text-sm" value="https://api.kayroslab.com" />
    </div>
    <button id="btn-load" type="button" class="rounded-full bg-sky-600 text-white font-semibold px-5 py-2 text-sm">Charger</button>
  </div>
  <div class="flex gap-2 text-xs">
    <button type="button" data-filter="all" class="filter-btn rounded-full border border-sky-600 bg-sky-50 text-sky-700 px-3 py-1 font-semibold">Tout</button>
    <button type="button" data-filter="tech" class="filter-btn rounded-full border border-slate-200 px-3 py-1">Tech</button>
    <button type="button" data-filter="business" class="filter-btn rounded-full border border-slate-200 px-3 py-1">Business</button>
  </div>
  <div id="entities" class="grid sm:grid-cols-2 gap-3"></div>
  <h2 class="font-display font-bold text-lg">Relations</h2>
  <div id="rels" class="space-y-2 text-sm"></div>
  <p id="status" class="text-xs text-slate-400"></p>
</main>
<script>
(function () {
  let data = null;
  let filter = 'all';
  const $ = (id) => document.getElementById(id);
  function esc(s) { return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

  function render() {
    if (!data) return;
    const ents = data.entities.filter((e) => filter === 'all' || e.group === filter);
    $('entities').innerHTML = ents.map((e) =>
      '<article class="rounded-xl border border-slate-200 p-4 bg-slate-50">'
      + '<div class="flex items-center gap-2 mb-1"><span class="text-xl">' + esc(e.icon) + '</span>'
      + '<strong class="font-display">' + esc(e.name) + '</strong>'
      + '<span class="text-[10px] uppercase text-slate-400 ml-auto">' + esc(e.group) + '</span></div>'
      + '<p class="text-xs text-slate-600 mb-2">' + esc(e.description) + '</p>'
      + '<div class="flex flex-wrap gap-1">' + (e.properties || []).map((p) =>
        '<span class="text-[10px] rounded-full bg-white border border-slate-200 px-2 py-0.5">' + esc(p.name) + '</span>'
      ).join('') + '</div></article>'
    ).join('');
    $('rels').innerHTML = (data.relationships || []).map((r) =>
      '<div class="rounded-lg border border-slate-100 bg-white px-3 py-2 flex flex-wrap gap-2 items-center">'
      + '<code class="text-sky-700 text-xs">' + esc(r.from) + '</code>'
      + '<span class="text-slate-400">→</span>'
      + '<strong class="text-xs">' + esc(r.name) + '</strong>'
      + '<span class="text-slate-400">→</span>'
      + '<code class="text-violet-700 text-xs">' + esc(r.to) + '</code>'
      + '<span class="text-[10px] text-slate-400 ml-auto">' + esc(r.cardinality) + '</span></div>'
    ).join('');
  }

  async function load() {
    const base = $('api').value.replace(/\/$/, '');
    $('status').textContent = 'Chargement…';
    try {
      const r = await fetch(base + '/v1/positionning/ontology');
      if (!r.ok) throw new Error('HTTP ' + r.status);
      data = await r.json();
      $('status').textContent = (data.entities?.length || 0) + ' entités · ' + (data.relationships?.length || 0) + ' relations';
      render();
    } catch (e) {
      $('status').textContent = e.message;
      $('entities').innerHTML = '';
      $('rels').innerHTML = '';
    }
  }

  document.querySelectorAll('.filter-btn').forEach((btn) => {
    btn.addEventListener('click', () => {
      filter = btn.getAttribute('data-filter');
      document.querySelectorAll('.filter-btn').forEach((b) => {
        b.classList.toggle('border-sky-600', b === btn);
        b.classList.toggle('bg-sky-50', b === btn);
        b.classList.toggle('text-sky-700', b === btn);
        b.classList.toggle('font-semibold', b === btn);
      });
      render();
    });
  });

  $('btn-load').addEventListener('click', load);
  const u = new URL(location.href);
  if (u.searchParams.get('api')) $('api').value = u.searchParams.get('api');
  load();
})();
</script>
</body>
</html>
